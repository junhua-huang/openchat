name: Build and test iOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    name: iOS Release archive
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 26 or newer
        run: python3 Scripts/select_xcode.py
      - name: Check portable math parser and MCP approval policy (no simulator)
        run: |
          swiftc Core/MCPApprovalPolicy.swift Core/MessageMath.swift Core/WorkingMemoryContent.swift \
            Core/APIConnection.swift Core/ReasoningEffort.swift Core/ModelCatalog.swift Core/ConversationUX.swift \
            Scripts/check_portable_core.swift \
            -o "$RUNNER_TEMP/check-portable-core"
          "$RUNNER_TEMP/check-portable-core"
      - name: Generate project
        run: python3 Scripts/generate_project.py
      - name: Archive Release for iOS
        run: |
          xcodebuild -version
          xcodebuild archive -project LiaoChat.xcodeproj -scheme LiaoChat -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/ReleaseCheck.xcarchive \
            -resultBundlePath build/ReleaseCheck.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Retain Release build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-results
          path: build/ReleaseCheck.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Compile regression tests for physical iOS devices (no simulator)
        run: |
          xcodebuild build-for-testing -project LiaoChat.xcodeproj -scheme LiaoChat -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath build/DeviceTests CODE_SIGNING_ALLOWED=NO
      - name: Check live public search availability
        continue-on-error: true
        timeout-minutes: 4
        run: python3 Scripts/check_search.py
      - name: Check live MCP registry and recommended catalogs
        continue-on-error: true
        timeout-minutes: 4
        run: python3 Scripts/check_mcp.py
