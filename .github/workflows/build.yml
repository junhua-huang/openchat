name: Build and test iOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 26 or newer
        run: python3 Scripts/select_xcode.py
      - name: Generate project
        run: python3 Scripts/generate_project.py
      - name: Select available iPhone simulator
        run: |
          xcodebuild -version
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          devices = json.loads(Path(os.environ['RUNNER_TEMP'], 'devices.json').read_text())['devices']
          candidates = [d for runtime, group in devices.items() if 'iOS' in runtime for d in group if d['isAvailable'] and 'iPhone' in d['name']]
          if not candidates: raise SystemExit('No iPhone simulator installed')
          with open(os.environ['GITHUB_ENV'], 'a') as f: f.write('SIMULATOR_ID=' + candidates[0]['udid'] + '\n')
          PY
      - name: Build and run tests
        run: |
          xcodebuild test -project LiaoChat.xcodeproj -scheme LiaoChat -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/DerivedData -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Capture native chat UI
        run: bash Scripts/capture-ui.sh
      - name: Retain native UI checks
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-checks
          path: build/ui/*.png
          retention-days: 7
      - name: Retain simulator build and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-build-and-tests
          path: |
            build/Tests.xcresult
            build/DerivedData/Build/Products/Debug-iphonesimulator/LiaoChat.app
          if-no-files-found: ignore
          retention-days: 7
