name: Build for TestFlight
on:
  push:
    branches: [release/testflight-20261019]
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to App Store Connect for TestFlight
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  archive:
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID || 'com.junhuahuang.openchat' }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'B2Y3564MKK' }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode 26 or newer
        run: python3 Scripts/select_xcode.py
      - name: Prepare signing
        run: bash Scripts/signing-setup.sh
      - name: Generate project
        env:
          OPENCHAT_DISTRIBUTION_SIGNING: "1"
          OPENCHAT_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: python3 Scripts/generate_project.py
      - name: Archive and export
        run: |
          xcodebuild -version
          xcodebuild archive -project LiaoChat.xcodeproj -scheme LiaoChat -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/LiaoChat.xcarchive
          xcodebuild -exportArchive -archivePath build/LiaoChat.xcarchive \
            -exportPath build/export -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Keep install package
        uses: actions/upload-artifact@v4
        with:
          name: LiaoChat-TestFlight-package
          path: build/export/*.ipa
          retention-days: 7
      - name: Upload to App Store Connect
        if: ${{ inputs.upload || (github.event_name == 'push' && github.ref == 'refs/heads/release/testflight-20261019') }}
        run: bash Scripts/upload-testflight.sh
      - name: Remove signing material
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -rf "$RUNNER_TEMP/liaochat-signing"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
